name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build
    uses: ./.github/workflows/pr.yml
    permissions:
      contents: read

  package:
    name: Package and publish plugin
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Package plugin source
        # Archive laid out for Traefik's local plugin directory, so it can be extracted straight into /plugins-local
        # on the Traefik host: plugins-local/src/<module path>/...
        id: package
        run: |
          MODULE="$(go list -m)"
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="traefik-swagger-merge-${TAG}.tar.gz"
          git archive --format=tar.gz \
            --prefix="plugins-local/src/${MODULE}/" \
            --output="${ARCHIVE}" HEAD
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: ${{ steps.package.outputs.archive }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256

      - name: Attach archive to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            --clobber
