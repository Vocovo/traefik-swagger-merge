name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test and package plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify vendored dependencies are in sync
        # Traefik (Yaegi) loads the plugin from source and needs the vendor directory committed.
        # Fail if go.mod/go.sum/vendor have drifted.
        run: |
          go mod verify
          go mod vendor
          git diff --exit-code -- go.mod go.sum vendor

      - name: Vet
        run: go vet -mod=vendor ./...

      - name: Build
        run: go build -mod=vendor ./...

# Tests currently don't pass
#      - name: Test
#        run: go test -mod=vendor -v -cover ./...

      - name: Validate Traefik plugin manifest
        run: |
          test -f .traefik.yml
          MODULE="$(go list -m)"
          IMPORT="$(sed -n 's/^import:[[:space:]]*//p' .traefik.yml)"
          echo "go.mod module:      $MODULE"
          echo ".traefik.yml import: $IMPORT"
          if [ "$MODULE" != "$IMPORT" ]; then
            echo "::error::.traefik.yml import path does not match go.mod module path"
            exit 1
          fi

      - name: Package plugin source
        # Archive laid out for Traefik's local plugin directory, so it can be extracted straight into /plugins-local
        # on the Traefik host: plugins-local/src/<module path>/...
        id: package
        run: |
          MODULE="$(go list -m)"
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="traefik-swagger-merge-${TAG}.tar.gz"
          git archive --format=tar.gz \
            --prefix="plugins-local/src/${MODULE}/" \
            --output="${ARCHIVE}" HEAD
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: ${{ steps.package.outputs.archive }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256

      - name: Attach archive to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            --clobber
